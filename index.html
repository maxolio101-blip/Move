<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Move</title>
  <meta name="description" content="Personal training, habits and steps tracker.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Move">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0B0B0F" id="meta-theme">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <noscript><p class="noscript">Move needs JavaScript.</p></noscript>

  <!-- Shown when opened in a regular browser tab -->
  <div id="install" class="install" hidden>
    <div class="install__inner">
      <img class="install__icon" src="./icons/icon-192.png" alt="" width="88" height="88">
      <h1 class="install__title" data-i18n="install.title"></h1>
      <p class="install__lead" data-i18n="install.lead"></p>

      <ol class="install__steps">
        <li><span class="install__num">1</span><span data-i18n="install.step1"></span></li>
        <li><span class="install__num">2</span><span data-i18n="install.step2"></span>
          <svg class="install__share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </li>
        <li><span class="install__num">3</span><span data-i18n="install.step3"></span></li>
        <li><span class="install__num">4</span><span data-i18n="install.step4"></span></li>
      </ol>

      <button class="btn btn--secondary btn--block" id="install-copy" type="button" data-i18n="install.copyLink"></button>

      <div class="card card--warn" role="note">
        <strong data-i18n="install.warnTitle"></strong>
        <p data-i18n="install.warnBody"></p>
      </div>
    </div>
  </div>

  <!-- The app -->
  <div id="app" class="app" hidden>
    <main class="views">
      <section class="view" id="view-today" role="tabpanel" aria-labelledby="tab-today" tabindex="-1">
        <header class="view__header">
          <p class="view__eyebrow num" id="today-date"></p>
          <h1 class="view__title" data-i18n="tabs.today"></h1>
        </header>
        <div class="view__body" id="today-body"></div>
      </section>

      <section class="view" id="view-history" role="tabpanel" aria-labelledby="tab-history" tabindex="-1" hidden>
        <header class="view__header"><h1 class="view__title" data-i18n="tabs.history"></h1></header>
        <div class="view__body"><div class="empty" data-i18n="placeholder.history"></div></div>
      </section>

      <section class="view" id="view-progress" role="tabpanel" aria-labelledby="tab-progress" tabindex="-1" hidden>
        <header class="view__header"><h1 class="view__title" data-i18n="tabs.progress"></h1></header>
        <div class="view__body"><div class="empty" data-i18n="placeholder.progress"></div></div>
      </section>

      <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" tabindex="-1" hidden>
        <header class="view__header"><h1 class="view__title" data-i18n="tabs.settings"></h1></header>
        <div class="view__body" id="settings-body"></div>
      </section>
    </main>

    <nav class="tabbar" role="tablist" aria-label="Main">
      <button class="tab" role="tab" id="tab-today" data-tab="today" aria-controls="view-today" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="tabs.today"></span>
      </button>
      <button class="tab" role="tab" id="tab-history" data-tab="history" aria-controls="view-history" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="tabs.history"></span>
      </button>
      <button class="tab" role="tab" id="tab-progress" data-tab="progress" aria-controls="view-progress" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="tabs.progress"></span>
      </button>
      <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-controls="view-settings" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span data-i18n="tabs.settings"></span>
      </button>
    </nav>

    <!-- Full-screen sheet layer (active workout, quick logs) -->
    <div class="sheet-layer" id="sheet-layer" hidden>
      <div class="sheet-scrim" data-sheet-close></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <div class="banner" id="banner-update" role="status" hidden>
      <span data-i18n="update.available"></span>
      <button class="banner__action" id="banner-update-btn" type="button" data-i18n="update.reload"></button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
